[package]
name = "arlet"
version = "0.2.2"
description = "Unofficial Apple Music client for Windows 10 and 11, built with Tauri v2 and MusicKit."
repository = "https://github.com/BurntToasters/Arlet"
homepage = "https://github.com/BurntToasters/Arlet#readme"
license = "GPL-3.0-only"
authors = ["BurntToasters <code@rosie.run>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["sync", "time"] }
window-vibrancy = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# Same version wry uses; needed for the WebView2 ProcessFailed hook.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Media",
    "Storage_Streams",
] }

[dev-dependencies]
minisign-verify = "0.2.5"

[features]
default = []

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
strip = true
