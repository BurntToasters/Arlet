name: Canary

# Scheduled early warnings for things that change without a commit:
# - Apple updates MusicKit JS in place on its CDN, and Arlet relies on some
#   undocumented MusicKit APIs. The native E2E probes the live script.
# - Every installed copy stops playing when the hosted MusicKit token expires
#   (180 days after minting). The hosted-token job checks the live file weekly.
# A failed run emails the repository owner; nothing here holds secrets.

on:
  schedule:
    # Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  NPM_VERSION: "12.2.1"

jobs:
  live-musickit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - name: Read pinned Rust version
        id: rust-pin
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/rust-toolchain.mjs)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - run: npm ci --ignore-scripts
      - run: npm run licenses
      # Includes "live MusicKit keeps every API Arlet relies on", which reads
      # the script Apple serves today. Uses a synthetic token; no secrets.
      - name: Native app E2E against live MusicKit
        run: npm run test:e2e:app
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-e2e-report
          path: e2e-artifacts/
          if-no-files-found: ignore

  hosted-token:
    # Runs weekly. The check fails below 45 days left, so a failing run still
    # leaves at least 38 days (45 minus one week) to renew. On failure, run
    # `npm run token:publish` without a release.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Hosted MusicKit token has at least 45 days left
        run: npm run token:check
