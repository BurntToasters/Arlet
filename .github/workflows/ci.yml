name: CI

# Pull requests prove candidate changes. Pushes prove the exact post-merge tips
# of the protected release branches. Jobs test code and build unsigned smoke
# artifacts only: routine CI never holds the .p8 key, Apple credentials,
# Authenticode credentials, or the Tauri updater private key (plan section 16).

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "1.98.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  commit-message-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - name: Enforce Co-authored-by trailer policy
        run: node scripts/strip-coauthor-trailers.js --check-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci --ignore-scripts
      - name: Version sync check
        run: |
          npm run sync-version
          git diff --exit-code
      - name: Full quality gate (offline frontend smoke)
        run: npm run test:all

  smoke-build:
    needs: quality-gate
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: clippy
      - run: npm ci --ignore-scripts
      - run: npm run sync-version
      - run: npm run licenses
      - name: Unsigned Tauri build (no bundle, no signing)
        # CI never holds the MusicKit token; this binary is never published.
        env:
          ARLET_SKIP_MUSICKIT_TOKEN: "1"
        run: npx tauri build --no-bundle
      - name: Verify smoke binary
        shell: bash
        run: test -e "src-tauri/target/release/arlet.exe"
      # The Ubuntu gate cannot see cfg(windows) code, so lint it here.
      - name: Windows clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Drives the real release binary (synthetic MusicKit token) through
      # WebView2's DevTools Protocol. x64 only to bound CI time.
      - name: Native app E2E
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: npm run test:e2e:app
      - name: Upload E2E report
        if: always() && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: e2e-artifacts/
          if-no-files-found: ignore

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: npm ci --ignore-scripts
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  ci-gate:
    if: ${{ always() }}
    needs:
      - commit-message-policy
      - quality-gate
      - smoke-build
      - security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE_POLICY: ${{ needs.commit-message-policy.result }}
          QUALITY_GATE: ${{ needs.quality-gate.result }}
          SMOKE_BUILD: ${{ needs.smoke-build.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_GATE" = success
          test "$SMOKE_BUILD" = success
          test "$SECURITY_AUDIT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$COMMIT_MESSAGE_POLICY" = success
          else
            test "$COMMIT_MESSAGE_POLICY" = skipped
          fi
